name: SpellCheck
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  typos:
    uses: "SciML/.github/.github/workflows/spellcheck.yml@v1"
    secrets: "inherit"
